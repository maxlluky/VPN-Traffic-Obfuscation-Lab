name: vpn-lab

services:
  target:
    image: ${NGINX_IMAGE}
    container_name: target-server
    networks:
      external_net:
        ipv4_address: 172.30.30.10

  gateway:
    image: ${WIREGUARD_IMAGE}
    container_name: vpn-gateway
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/London}
      - SERVERPORT=${WG_SERVER_PORT:-51820}
      - PEERS=${WG_PEER_NAME:-client1}
      - PEERDNS=1.1.1.1
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ./services/gateway/wireguard:/config
      - /lib/modules:/lib/modules:ro
    networks:
      client_net:
        ipv4_address: 192.168.10.2
      external_net:
        ipv4_address: 172.30.30.2

  wg-client:
    build:
      context: ./services/wg-client
      args:
        ALPINE_TAG: ${ALPINE_TAG}
    container_name: wg-client
    cap_add:
      - NET_ADMIN
    volumes:
      - ./services/wg-client/wireguard:/config:ro
    networks:
      client_net:
        ipv4_address: 192.168.10.10
    depends_on:
      - gateway

  client:
    build:
      context: ./services/client
      args:
        ALPINE_TAG: ${ALPINE_TAG}
    container_name: client-node
    network_mode: "service:wg-client"
    command: ["sleep", "infinity"]

  suricata:
    image: ${SURICATA_IMAGE}
    container_name: suricata-ids
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./services/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./services/suricata/rules:/var/lib/suricata/rules
      - ./results/suricata-alerts:/var/log/suricata
    command: ["-i", "${BRIDGE_IF}", "-l", "/var/log/suricata", "-c", "/etc/suricata/suricata.yaml"]

networks:
  client_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  external_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.30.0/24
