name: vpn-lab

# Base configuration shared across all scenarios (baseline, udp2raw, obfs4)
# Scenario-specific services are defined in compose.baseline.yml, compose.udp2raw.yml, etc.

services:
  target:
    image: ${NGINX_IMAGE}
    container_name: target-server
    networks:
      external_net:
        ipv4_address: 172.30.30.10

  suricata:
    image: ${SURICATA_IMAGE}
    container_name: suricata-ids
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./services/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./services/suricata/rules:/var/lib/suricata/rules
      - ./results/suricata-alerts:/var/log/suricata
    command: ["-i", "${BRIDGE_IF}", "-l", "/var/log/suricata", "-c", "/etc/suricata/suricata.yaml"]

networks:
  client_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  external_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.30.0/24
