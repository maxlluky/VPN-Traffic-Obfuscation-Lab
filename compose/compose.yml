name: vpn-lab

# Base configuration shared across all scenarios (baseline, udp2raw, obfs4)
# Scenario-specific services are defined in compose.baseline.yml, compose.udp2raw.yml, etc.

services:
  target:
    image: ${NGINX_IMAGE}
    container_name: target-server
    networks:
      external_net:
        ipv4_address: 172.30.30.10
    volumes:
      - ../services/target-server/html:/usr/share/nginx/html
    # Install iperf3 and run it in background, then start nginx
    entrypoint: /bin/sh -c "apk add --no-cache iperf3 && iperf3 -s -D && nginx -g 'daemon off;'"

  suricata:
    build:
      context: ../services/suricata
    container_name: suricata-ids
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ../services/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ../services/suricata/rules:/var/lib/suricata/rules
      - ../results/suricata-alerts:/var/log/suricata
      # metadata.json written to log dir
    command: [ "-i", "${BRIDGE_IF}", "-l", "/var/log/suricata", "-c", "/etc/suricata/suricata.yaml" ]

  zeek:
    image: ${ZEEK_IMAGE}
    container_name: zeek-nsm
    network_mode: host
    working_dir: /var/log/zeek
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../results/zeek-logs:/var/log/zeek
      - ../services/zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek
    command: [ "zeek", "-C", "-i", "${BRIDGE_IF}", "local" ]

networks:
  client_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  external_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.30.0/24
