# Baseline scenario: Plain WireGuard without obfuscation

services:
  gateway:
    image: ${WIREGUARD_IMAGE}
    container_name: vpn-gateway
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/London}
      - SERVERPORT=${WG_SERVER_PORT:-51820}
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ../services/vpn-server/baseline:/config
      - /lib/modules:/lib/modules:ro
    networks:
      client_net:
        ipv4_address: 192.168.10.2
      external_net:
        ipv4_address: 172.30.30.2

  wg-client:
    build:
      context: ../services/vpn-client
      args:
        ALPINE_TAG: ${ALPINE_TAG}
    container_name: wg-client
    cap_add:
      - NET_ADMIN
    volumes:
      - ../services/vpn-client/baseline:/config:ro
    networks:
      client_net:
        ipv4_address: 192.168.10.10
    depends_on:
      - gateway

  client:
    build:
      context: ../services/traffic-client
      args:
        ALPINE_TAG: ${ALPINE_TAG}
    container_name: client-node
    network_mode: "service:wg-client"
